// tracker-server/build.gradle — app standalone para servir el protocolo tracker Azorea (ver AGENTS.md § DA-5).
// No depende de NeoForge; solo JDK 21 + Gson.

plugins {
    id 'application'
    id 'java'
}

// § DA-13: mismo srcDir q/ `:v1_21_1` — una copia d/ AzoreaId/AzoreaIdentity/
// AzoreaBase32/AzoreaPunchExchange, compilada aquí tmb ⇒ el tracker standalone PUEDE
// verificar firma + rederivar el id (sin ésto acepta announces d/ cualquiera — audit F9).
sourceSets.main.java.srcDir('../shared/src/main/java')

application {
    mainClass = 'com.azorea.tracker.server.TrackerServerMain'
    // Permite configurar puerto / data file vía -Dtracker.port=9090 -Dtracker.data=...
    applicationDefaultJvmArgs = ['-Dtracker.port=9090', '-Dtracker.data=tracker-data.json']
}

jar {
    manifest {
        attributes(
            'Main-Class': 'com.azorea.tracker.server.TrackerServerMain',
            'Implementation-Title': 'Azorea TrackerServer',
            'Implementation-Version': '0.1.0'
        )
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Gson para JSON (misma versión usada por NeoForge para evitar drift).
    implementation 'com.google.code.gson:gson:2.11.0'

    // Tests E2E (ver F2.5 + AGENTS.md § Próximos pasos)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.0'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = false
    }
}
