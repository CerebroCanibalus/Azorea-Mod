# Gradle JVM
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Mod metadata
mod_id=azorea
mod_name=Azorea
mod_license=GPL-3.0
mod_version=1.4.11
mod_group_id=com.azorea
mod_authors=General Beria
mod_description=P2P multiplayer, autohost, and lightweight network optimization for NeoForge.

# Versiones Minecraft / NeoForge / ModDevGradle
# Ajustar si hay updates; ver https://neoforged.net/ y https://github.com/neoforged/ModDevGradle
# NeoForge versioning: para MC 1.21.1 el formato es 21.1.x (no 52.x).
# `loader_version_range` usa el prefijo mayor.menor como rango de loader interface.
minecraft_version=1.21.1
neoForge_version=21.1.250
moddevgradle_version=2.0.146
loader_version_range=[21.1,)

# Mappings: official por defecto (NeoForge usa official por defecto).
mappings_channel=official
mappings_version=1.21.1

# Java toolchain para subproyectos (descargado por foojay-resolver al 1.er build).
java_toolchain_version=21
